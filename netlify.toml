[build]
  command = "npm run build"
  # Next.js static export (output: "export") writes here
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# SPA-style fallback so client-side routing always works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
